<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 3</title>
</head>
<body>

    <br>

    <table border="black">
        <caption>Food Menu</caption>
        <thead>
        <tr>
            <th rowspan="2">Item</th>
            <th colspan="2">Prices</th>
        </tr>
        <tr>
            <th>INR</th>
            <th>USD</th>
        </tr>
        </thead>

        <tbody>
        <tr>
            <td>Frooti</td>
            <td>10</td>
            <td>0.14</td>
        </tr>
        <tr>
            <td>Samosa</td>
            <td>12</td>
            <td>0.17</td>
        </tr>
        <tr>
            <td>Chips</td>
            <td>20</td>
            <td>0.28</td>
        </tr>
        <tr>
            <td>Kurkure</td>
            <td>25</td>
            <td>0.31</td>
        </tr>
        </tbody>
    </table>

    <br>
    <h2>Form</h2>
    <form action="/action">
        <div>
        <label for="username">UserName:</label>
        <input type="text" placeholder="Enter Your Username" id="username">
        </div>
        <div>
        <label for="password">Password:</label>
        <input type="password" placeholder="Enter Your Password" id="password">
        </div>
        <div>
        <label for="number">Number:</label>
        <input type="number" placeholder="Enter your Number" id="number">
        </div>
        <div>
        <label for="time">Time:</label>
        <input type="time" placeholder="Enter Shedule Time" id="time"><br>
        </div>
        <div>
        <label for="color">Color:</label>
        <input type="color" placeholder="Enter Color" id="color"><br>
        </div>
        <br>

        <div>
            Select Your Brightness
            <input type="range" name="brightness" min="0" max="100">
            <label for="brigtness">Brightness</label>
        </div>
        <br>
        
        <div>
            <label for="age">I am 18+</label>
            <input type="checkbox" id="age" name="age">
        </div>
        <br>

        <h4>Select Your Gender</h4>
        <div>
            <input type="radio" name="Gender" id="male">
            <label for="male">Male</label>
            <input type="radio" name="Gender" id="female">
            <label for="female">Female</label>
            <input type="radio" name="Gender" id="other">
            <label for="other">Other</label>
        </div>
        <br>

        <div>
            Choose Your Payment Method &nbsp;
            <select name="Method" id="Method">
                <option>Select Your Option</option>
                <option value="Online">Online</option>
                <option value="Cash">Cash</option>
            </select>
        </div>
        <br>

        <label id="feedback">Please Provide your valuable feedback: </label> &nbsp; <br>
        <textarea id="feedback" placeholder="Write Your Feedabck Here..." role="application" rows="4" cols="35"></textarea>
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        
        <input type="submit" value="Forgot Password">
    </form>
    <br>
    <form action="https://www.google.com/search">
        <label for="search">Search on Internet</label>
        <input type="search" placeholder="Search on Internet" id="search" name="q">
        <button type="submit">Search</button>
    </form>
    <br>
    <form action="https://www.youtube.com/results">
        <label for="search">Search on Youtube</label>
        <input type="search" placeholder="Search on Youtube" id="search" name="search_query">
        <button type="submit">Search</button>
    </form>
    <br>
</body>
</html>
